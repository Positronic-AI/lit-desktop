name: Build macOS DMG

# Manual trigger — builds a branded, unsigned .dmg for testers.
# The backend is installed from the PUBLIC pre-built wheel (Positronic-AI/
# lit-releases) — this repo needs NO access to lit-lib source and NO token.
on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand to build"
        type: choice
        options: [jovai, litai]
        default: jovai
      arch:
        description: "macOS architecture (arm64 = Apple Silicon, x64 = Intel)"
        type: choice
        options: [arm64, x64]
        default: arm64
      lib_version:
        description: "positronic-lit wheel version (blank/latest -> newest published)"
        default: "latest"
      version:
        description: "Version override (blank -> auto 2.0.<run number>)"
        default: ""

jobs:
  build-dmg:
    # arm64 -> macos-latest (Apple Silicon); x64 -> macos-13 (Intel runner).
    runs-on: ${{ inputs.arch == 'x64' && 'macos-13' || 'macos-latest' }}
    permissions:
      contents: write # to publish the release
    env:
      # Auto-incrementing build version: each run bumps the patch. Override via input.
      LIT_BUILD_VERSION: ${{ inputs.version || format('2.0.{0}', github.run_number) }}
      # Code signing gate. Only this ONE flag lives at job level: it drives the
      # `if:` on the signing steps. The APPLE_* values are exported into the
      # environment by the import step BELOW, and only when the secret is set —
      # because an unset secret arrives as an EMPTY string, and Tauri treats a
      # present-but-empty APPLE_CERTIFICATE as "sign with this" and dies on
      # `security import` (both mac legs of 2.5.8, 2026-08-22). Unset secrets
      # must mean: no APPLE_* vars at all, unsigned build, exactly as before.
      # Secrets: docs/runbooks/code-signing.md.
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - name: Checkout lit-desktop
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout lit-bridge-rs (native bridge, public)
        uses: actions/checkout@v4
        with:
          repository: Positronic-AI/lit-bridge-rs
          ref: main
          path: lit-bridge-rs-src

      - name: Import signing certificate + notarization key
        if: env.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          # Tauri imports APPLE_CERTIFICATE into its own keychain for the .app;
          # the bridge/sidecar steps above sign BEFORE tauri runs, so the cert
          # must also be in a keychain codesign can find now.
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KC"
          security list-keychain -d user -s "$KC" login.keychain-db
          # runner.temp is only valid at step level, not job-level env — a
          # job-level `${{ runner.temp }}` makes the whole workflow unparseable
          # and every dispatch 422s (this bit 2.5.8's mac builds, 2026-08-21).
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          # Export the signing vars for the later build step (tauri reads them)
          # — ONLY on this enabled path, so an unsigned build never sees them.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: Build + ad-hoc sign the native bridge
        run: |
          cargo build --release --manifest-path "$GITHUB_WORKSPACE/lit-bridge-rs-src/Cargo.toml"
          BIN="$GITHUB_WORKSPACE/lit-bridge-rs-src/target/release/lit-bridge-rs"
          # Ad-hoc sign so Apple Silicon will exec it as a subprocess. Standalone
          # binary (no dylib loading from us), so plain ad-hoc is sufficient.
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            # Real signing run: Developer ID + hardened runtime + timestamp,
            # otherwise notarization rejects the bundle for this binary.
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$BIN"
          else
            codesign --force --sign - --timestamp=none "$BIN"
          fi
          # The PyInstaller spec bundles this verbatim (datas) so the signature
          # survives; the entry point resolves it and sets LIT_BRIDGE_RS_BIN.
          echo "LIT_BRIDGE_RS_BUNDLE=$BIN" >> "$GITHUB_ENV"
          echo "native bridge built + signed: $BIN"

      - name: Freeze the backend (PyInstaller, from public wheel)
        working-directory: backend
        env:
          # install.py prints a box-drawing banner; force UTF-8 for parity with
          # the Windows job (harmless on macOS, which already defaults to UTF-8).
          PYTHONUTF8: "1"
        run: |
          python -m pip install --upgrade pip pyinstaller
          # Install the compiled backend from the PUBLIC releases (no lit-lib source).
          curl -fsSL -o install.py https://github.com/Positronic-AI/lit-releases/releases/latest/download/install.py
          VER="${{ inputs.lib_version }}"
          if [ -n "$VER" ] && [ "$VER" != "latest" ]; then
            python install.py --version "$VER"
          else
            python install.py
          fi
          pyinstaller --noconfirm lit-server.spec
          # Bake the ACTUAL installed wheel version into the frontend build
          # (vite reads VITE_LIB_VERSION) — the adopt-case handshake compares
          # it against the running backend's /health version. Resolved from
          # the venv, not inputs.lib_version, so "latest" works too.
          echo "VITE_LIB_VERSION=$(python -c 'import importlib.metadata as m; print(m.version("positronic-lit"))')" >> "$GITHUB_ENV"

      - name: Stage the frozen backend as the Tauri sidecar
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          echo "host triple: $TRIPLE"
          mkdir -p src-tauri/binaries
          cp "backend/dist/lit-server" "src-tauri/binaries/lit-server-${TRIPLE}"
          chmod +x "src-tauri/binaries/lit-server-${TRIPLE}"

      - name: Build the branded .dmg
        run: |
          npm install
          ./scripts/build-brand.sh "${{ inputs.brand }}"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.brand }}-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Each brand publishes to its own org's downloads repo, rolling "latest"
      # with stable brand-prefixed names: litai -> Positronic-AI/lit-desktop-
      # releases (RELEASES_TOKEN), jovai -> automateix/jovai-desktop-releases
      # (JOVAI_RELEASES_TOKEN).
      - name: Publish
        env:
          GH_TOKEN: ${{ inputs.brand == 'jovai' && secrets.JOVAI_RELEASES_TOKEN || secrets.RELEASES_TOKEN }}
        run: |
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          ARCH="${{ inputs.arch }}"; ARCH="${ARCH:-arm64}"
          if [ "${{ inputs.brand }}" = "litai" ]; then REPO="Positronic-AI/lit-desktop-releases"; PREFIX="LIT-Desktop"; TITLE="LIT Desktop (latest)"; else REPO="automateix/jovai-desktop-releases"; PREFIX="JovAI"; TITLE="JovAI Desktop (latest)"; fi
          NAME="${PREFIX}-macOS-${ARCH}.dmg"
          cp "$DMG" "$NAME"
          gh release view latest --repo "$REPO" >/dev/null 2>&1 || \
            gh release create latest --repo "$REPO" --title "$TITLE" \
              --notes "Latest ${PREFIX} installers (macOS, Windows, Linux). Unsigned early-access builds." --latest
          gh release upload latest "$NAME" --repo "$REPO" --clobber
          echo "published $NAME (${LIT_BUILD_VERSION}) to $REPO/releases/latest"
