<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIT</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <!-- App-level toolbar. Favorites rail + global controls. Right-click to reposition. -->
      <div id="app-toolbar" title="Right-click to reposition">
        <button id="toolbar-add" class="icon-btn header-btn" title="Add a shortcut">+</button>
        <div id="toolbar-favorites"></div>
        <button id="settings-btn-global" class="icon-btn header-btn" title="Settings">&#9881;</button>
        <button id="theme-toggle" class="icon-btn header-btn" title="Toggle theme">&#9790;</button>
      </div>
      <main id="content">
        <div id="dockview-container"></div>
        <!-- Live terminal — a full-area overlay over the dock for now; becomes a
             dockable panel in a later step. -->
        <div id="terminal-panel" style="display:none">
          <div id="terminal-panel-header">
            <span id="terminal-panel-title">Live terminal</span>
            <span id="terminal-panel-hint">— you're driving the real session; type to steer it</span>
            <button id="terminal-drawer-close" title="Close terminal">&times;</button>
          </div>
          <div id="terminal-host"></div>
        </div>
        <!-- Chat panel content. ChatPanel.mount() clones this template into its
             dockview panel host; all lookups inside are per-instance (classes,
             not ids), so a future multi-instance UI can clone it repeatedly. -->
        <template id="chat-panel-template">
          <div class="chat-panel-root">
            <nav class="sidebar">
              <div class="channel-list">
                <div class="section-label">Channels</div>
              </div>
            </nav>
            <div class="sidebar-resize-handle"></div>
            <div class="chat-main">
              <header class="content-header">
                <button class="icon-btn header-btn sidebar-expand-btn" title="Show sidebar" style="display:none">&#9654;</button>
                <h2 class="channel-title">Welcome</h2>
                <div class="channel-actions"></div>
                <button class="icon-btn header-btn search-toggle-btn" title="Search this channel (Ctrl+F)">&#128269;</button>
              </header>
              <div class="messages-wrapper">
              <div class="messages">
                <!-- Boot state — replaced by the first real render; brand and
                     version are stamped by init() (template stays brand-neutral). -->
                <div class="boot-state">
                  <div class="boot-brand"><span class="boot-brand-name"></span><span class="boot-version"></span></div>
                  <div class="boot-spinner"></div>
                  <div class="boot-text">Starting…</div>
                  <div class="boot-hint">First launch can take a minute while things unpack.</div>
                </div>
              </div>
              <button class="scroll-to-bottom" title="Scroll to bottom">
                <span class="scroll-arrow">&#8595;</span>
              </button>
            </div>
            <div class="input-resize-handle"></div>
            <div class="input-area">
              <!-- Composer controls row: To: ● agent ▾ · model ▾ · usage · caps | >_ ⚙ -->
              <div class="agent-info"></div>
              <!-- The prompt pill (webapp chat-input parity, 2026-11-01): image · attach · mic
                   inside the rounded field, the send arrow at its right end. -->
              <div class="input-row">
                <div class="prompt-pill">
                  <div class="input-actions">
                    <button class="image-btn" title="Upload image"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></button>
                    <button class="attach-btn" title="Attach file"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
                    <button class="mic-btn" title="Voice input is not in the desktop app yet" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
                  </div>
                  <textarea class="message-input" placeholder="Type your message here..." rows="1"></textarea>
                  <button class="cancel-stream-btn" title="Stop the agent (interrupts the current turn; what it said so far is kept)" style="display:none"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21 7c-.55 0-1 .45-1 1v4h-1V4c0-.55-.45-1-1-1s-1 .45-1 1v8h-1V3c0-.55-.45-1-1-1s-1 .45-1 1v9h-1V5c0-.55-.45-1-1-1s-1 .45-1 1v10.4L8.8 12.5c-.5-.6-1.4-.7-2.1-.3-.6.4-.8 1.2-.5 1.9L9.2 20c.8 1.8 2.6 3 4.6 3H17c2.8 0 5-2.2 5-5V8c0-.55-.45-1-1-1z"/></svg><span>Stop</span></button>
                  <button class="send-btn" title="Send (Enter)"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg></button>
                </div>
              </div>
            </div>
            </div>
          </div>
        </template>
      </main>
    </div>
    <div id="image-lightbox">
      <span id="lightbox-close">&times;</span>
      <img id="lightbox-img" src="" alt="Enlarged image" />
    </div>
    <div id="command-palette-overlay">
      <div id="command-palette">
        <input type="text" id="command-input" placeholder="Type a command..." autocomplete="off" />
        <div class="command-list" id="command-list"></div>
      </div>
    </div>
  </body>
</html>
